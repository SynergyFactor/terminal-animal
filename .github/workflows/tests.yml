name: tests
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      # The tests need no Qt and no internet (network tests use a local fake server).
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Compile check (all modules)
        run: python -m compileall -q app scripts build.py manager.py run.py
